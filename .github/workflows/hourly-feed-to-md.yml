name: Hourly feed to Markdown

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: hourly-feed-to-md
  cancel-in-progress: false

jobs:
  convert:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      AZURE_AI_PROJECT_ENDPOINT: ${{ vars.AZURE_AI_PROJECT_ENDPOINT }}
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${{ vars.AZURE_AI_MODEL_DEPLOYMENT_NAME }}
      AZURE_CORE_OUTPUT: none
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        id: dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: ga

      - name: Select SDK and prepare output
        env:
          DOTNET_SDK_VERSION: ${{ steps.dotnet.outputs.dotnet-version }}
        run: |
          if ($env:DOTNET_SDK_VERSION -notmatch '^10\.0\.\d+$' -or
              [version]$env:DOTNET_SDK_VERSION -lt [version]'10.0.300') {
            throw 'The app requires a stable .NET SDK 10.0.300 or later in the 10.0 series.'
          }
          dotnet new globaljson --sdk-version $env:DOTNET_SDK_VERSION --roll-forward disable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path -LiteralPath '.\output') {
            Remove-Item -LiteralPath '.\output' -Recurse -Force
          }

      - name: Log in to Azure with OIDC
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Convert feed to Markdown
        id: convert
        run: dotnet run --file .\app.cs -- --count 10 --output-dir .\output

      - name: Publish job summary
        if: ${{ always() }}
        env:
          CONVERSION_OUTCOME: ${{ steps.convert.outcome }}
        run: |
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          if ($env:CONVERSION_OUTCOME -ne 'success') {
            [System.IO.File]::WriteAllText(
              $env:GITHUB_STEP_SUMMARY,
              "# RSS変換は完了していません`n`n実行ログを確認してください。`n",
              $utf8)
            return
          }
          try {
            $files = @(Get-ChildItem -LiteralPath '.\output' -Recurse -File -Filter '*.md' -ErrorAction Stop)
            if ($files.Count -ne 1) {
              throw 'Expected exactly one generated Markdown file.'
            }
            if ($files[0].Length -gt 1MB) {
              throw 'Generated Markdown exceeds the 1 MiB job summary limit.'
            }
            $markdown = [System.IO.File]::ReadAllText($files[0].FullName, $utf8)
            if ([string]::IsNullOrWhiteSpace($markdown)) {
              throw 'Generated Markdown is empty.'
            }
            if ($utf8.GetByteCount($markdown) -gt 1MB) {
              throw 'Generated Markdown exceeds the 1 MiB job summary limit.'
            }
            [System.IO.File]::WriteAllText($env:GITHUB_STEP_SUMMARY, $markdown, $utf8)
          } catch {
            [System.IO.File]::WriteAllText(
              $env:GITHUB_STEP_SUMMARY,
              "# Job summaryの生成に失敗しました`n`n実行ログを確認してください。`n",
              $utf8)
            throw
          }

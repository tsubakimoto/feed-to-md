name: Hourly feed to Markdown

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      count:
        description: '取得する記事件数（正の整数）'
        type: number
        required: false
        default: 10

permissions:
  contents: read
  id-token: write

concurrency:
  group: hourly-feed-to-md
  cancel-in-progress: false

jobs:
  convert:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      AZURE_AI_PROJECT_ENDPOINT: ${{ vars.AZURE_AI_PROJECT_ENDPOINT }}
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${{ vars.AZURE_AI_MODEL_DEPLOYMENT_NAME }}
      AZURE_CORE_OUTPUT: none
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        id: dotnet
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: ga

      - name: Select SDK and prepare output
        env:
          DOTNET_SDK_VERSION: ${{ steps.dotnet.outputs.dotnet-version }}
        run: |
          set -euo pipefail
          if [[ ! "${DOTNET_SDK_VERSION:-}" =~ ^10\.0\.([0-9]+)$ ]] ||
              (( 10#${BASH_REMATCH[1]} < 300 )); then
            printf '%s\n' 'The app requires a stable .NET SDK 10.0.300 or later in the 10.0 series.' >&2
            exit 1
          fi
          dotnet new globaljson --sdk-version "$DOTNET_SDK_VERSION" --roll-forward disable
          rm -rf -- output

      - name: Log in to Azure with OIDC
        uses: Azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Convert feed to Markdown
        id: convert
        env:
          ARTICLE_COUNT: ${{ inputs.count }}
        run: dotnet run --file app.cs -- --count "${ARTICLE_COUNT:-10}" --output-dir output

      - name: Publish job summary
        if: ${{ always() }}
        env:
          CONVERSION_OUTCOME: ${{ steps.convert.outcome }}
        run: |
          set -euo pipefail
          if [[ "${CONVERSION_OUTCOME:-}" != 'success' ]]; then
            printf '%s\n\n%s\n' '# RSS変換は完了していません' '実行ログを確認してください。' > "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          fail_summary() {
            printf '%s\n\n%s\n' '# Job summaryの生成に失敗しました' '実行ログを確認してください。' > "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "${1:-Job summary generation failed.}" >&2
            exit 1
          }
          trap 'fail_summary' ERR
          file_list=$(mktemp)
          trap 'rm -f -- "$file_list"' EXIT
          find output -type f -name '*.md' -print0 > "$file_list"
          mapfile -d '' -t files < "$file_list"
          if (( ${#files[@]} != 1 )); then
            fail_summary 'Expected exactly one generated Markdown file.'
          fi
          bytes=$(wc -c < "${files[0]}")
          if (( bytes > 1048576 )); then
            fail_summary 'Generated Markdown exceeds the 1 MiB job summary limit.'
          fi
          if ! LC_ALL=C.UTF-8 grep -qP '[^\s\p{Z}\x{0085}]' "${files[0]}"; then
            fail_summary 'Generated Markdown is empty.'
          fi
          cat -- "${files[0]}" > "$GITHUB_STEP_SUMMARY"
